<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/rra-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="RRA Tax Handbook 2026 - Complete guide to Rwanda's tax system, registration, declarations, and payments" />
  <meta name="keywords"
    content="RRA, Rwanda Revenue Authority, tax handbook, taxes, registration, VAT, income tax, customs" />
  <meta name="author" content="Rwanda Revenue Authority" />
  <title>RRA Tax Handbook 2026 - Rwanda Revenue Authority</title>

  <!-- Google Translate: define callback + helpers before the script loads -->
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        { pageLanguage: 'en', includedLanguages: 'fr,rw', autoDisplay: false },
        'google_translate_element'
      );
    }

    var __rraGTCombo = null;
    // Sequence counter: incrementing it cancels any in-flight retry loop from an older call.
    var __rraSeq = 0;

    window.__rraSetTranslation = function (lang) {
      var mySeq = ++__rraSeq;

      if (!lang || lang === 'en') {
        // English / reset mode: cancel pending retries, restore original.
        var resetTries = 0;
        (function doReset() {
          if (mySeq !== __rraSeq) return; // a newer call took over — abort
          var select = __rraGTCombo || document.querySelector('.goog-te-combo');
          if (select) {
            __rraGTCombo = select;
            if (select.value) {
              select.value = '';
              select.dispatchEvent(new Event('change', { bubbles: true }));
            }
          } else if (++resetTries < 40) {
            setTimeout(doReset, 50);
          }
        })();
        return;
      }

      // Non-English: apply translation, retrying until the GT widget is ready.
      var tries = 0;
      (function attempt() {
        if (mySeq !== __rraSeq) return; // cancelled by a newer call
        var select = __rraGTCombo || document.querySelector('.goog-te-combo');
        if (select) {
          __rraGTCombo = select;
          select.value = lang;
          select.dispatchEvent(new Event('change', { bubbles: true }));
        } else if (++tries < 80) {
          setTimeout(attempt, 50);
        }
      })();
    };
  </script>
  <!-- Load GT async so it starts downloading immediately, in parallel with page render -->
  <script async src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <style>
    html {
      background: linear-gradient(135deg, #093e61 0%, #0c5a8a 100%);
    }
    body {
      background: white;
      /* Override Google Translate's body.top push-down */
      top: 0 !important;
      position: static !important;
    }

    /* ── Hide every Google Translate UI element ── */
    #goog-te-banner-frame,
    .goog-te-banner-frame,
    .goog-te-gadget,
    .goog-te-gadget-simple,
    .goog-te-gadget-icon,
    .goog-te-menu-frame,
    .goog-te-balloon-frame,
    .goog-tooltip,
    .goog-tooltip:hover,
    .goog-te-ftab-float,
    #google_translate_element,
    iframe.skiptranslate,
    body > .skiptranslate {
      display: none !important;
      visibility: hidden !important;
    }
    .goog-text-highlight {
      background-color: transparent !important;
      box-shadow: none !important;
    }
  </style>
</head>

<body>
  <div id="google_translate_element"></div>
  <div id="root"></div>

  <script>
    /* Aggressively suppress the GT top-bar: watch for it and hide immediately */
    (function () {
      function suppress() {
        var frame = document.getElementById('goog-te-banner-frame') ||
                    document.querySelector('iframe.goog-te-banner-frame') ||
                    document.querySelector('iframe.skiptranslate');
        if (frame) {
          frame.style.setProperty('display', 'none', 'important');
          frame.style.setProperty('visibility', 'hidden', 'important');
        }
        if (document.body && document.body.style.top && document.body.style.top !== '0px') {
          document.body.style.setProperty('top', '0px', 'important');
        }
      }
      var obs = new MutationObserver(suppress);
      document.addEventListener('DOMContentLoaded', function () {
        obs.observe(document.body, { childList: true, subtree: false, attributes: true, attributeFilter: ['style'] });
        suppress();
      });
      window.addEventListener('load', suppress);
    })();
  </script>

  <script type="module" src="./src/main.jsx"></script>
</body>

</html>
