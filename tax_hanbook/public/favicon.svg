<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Navy background -->
  <rect width="64" height="64" rx="12" fill="#093e61"/>

  <!-- Colorful splash dots mimicking RRA logo -->
  <!-- Green top-left -->
  <ellipse cx="18" cy="14" rx="8" ry="6" fill="#4caf50" transform="rotate(-30 18 14)"/>
  <!-- Blue top-right -->
  <ellipse cx="46" cy="14" rx="8" ry="6" fill="#2196f3" transform="rotate(30 46 14)"/>
  <!-- Orange bottom-left -->
  <ellipse cx="14" cy="36" rx="7" ry="5" fill="#ff9800" transform="rotate(-50 14 36)"/>
  <!-- Green bottom-right -->
  <ellipse cx="50" cy="36" rx="7" ry="5" fill="#4caf50" transform="rotate(50 50 36)"/>
  <!-- Center stem -->
  <rect x="29" y="14" width="6" height="22" rx="3" fill="#1a6fa8"/>

  <!-- RRA text -->
  <text x="32" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#f5a623" letter-spacing="1">RRA</text>
</svg>
